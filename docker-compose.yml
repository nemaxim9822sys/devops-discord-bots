services:
  postgres:
    image: postgres:17-alpine
    container_name: discord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-discord_bot}
      POSTGRES_USER: ${DB_USER:-discord_bot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-discord_bot} -d ${DB_NAME:-discord_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracker-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    container_name: discord-tracker-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./discord-bot/.env
    volumes:
      - ./discord-bot/google-service-account.json:/app/google-service-account.json:ro

  transcriber-bot:
    build:
      context: ./discord-transcriber
      dockerfile: Dockerfile
    container_name: discord-transcriber-bot
    restart: unless-stopped
    env_file:
      - ./discord-transcriber/.env
    volumes:
      - ./discord-transcriber/.env.recorders:/app/.env.recorders:ro
      - transcriber_data:/app/meeting-data

volumes:
  postgres_data:
  transcriber_data:
